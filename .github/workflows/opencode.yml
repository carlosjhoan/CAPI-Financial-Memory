name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  opencode-comment:
    if: |
      github.event_name == 'issue_comment' && (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
  opencode-ci-triage:
    if: |
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'ci-failure') &&
      github.event.issue.user.login != 'opencode-agent[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Este issue fue generado automáticamente por un fallo de CI.
            Revisa el log del fallo y el código relevante.

            Reglas estrictas:
            - Haz SOLO el cambio mínimo necesario para corregir el fallo puntual.
            - No refactorices ni toques archivos fuera del alcance del error.
            - No modifiques tests para "hacerlos pasar"; si el fix implica
              cambiar un test, detente y explica por qué en el issue.
            - Crea la rama con prefijo opencode/ y abre un PR con el label
              "opencode-fix". NO hagas merge bajo ninguna circunstancia.
            - Si no hay una causa clara y acotada, no edites código: comenta
              tu diagnóstico en el issue y detente ahí.