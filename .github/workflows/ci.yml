name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: pfm_test
      JWT_SECRET: ci-jwt-secret-min-32-characters-long-for-testing
      GOOGLE_CLIENT_ID: ci-dummy-client-id-for-validation
      GOOGLE_CLIENT_SECRET: ci-dummy-client-secret-for-validation
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm run test -w backend
      - run: npm run build -w backend
      - run: npm run migration:run -w backend
      - run: npm run test:e2e -w backend

      - name: Crear issue si falla
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "CI Failure: backend (${{ github.workflow }} #${{ github.run_number }})" \
            --body "Falló el job **backend** en el commit ${{ github.sha }} (rama ${{ github.ref_name }}).
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure"

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm run test -w frontend
      - run: npm run build -w frontend

      - name: Crear issue si falla
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "CI Failure: frontend (${{ github.workflow }} #${{ github.run_number }})" \
            --body "Falló el job **frontend** en el commit ${{ github.sha }} (rama ${{ github.ref_name }}).
          Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure"